<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#02040a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Cyber Shield -->
  <path d="M32 8 L50 16 C50 36 32 52 32 56 C32 52 14 36 14 16 Z" 
        fill="url(#shieldGrad)" fill-opacity="0.18" 
        stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Cellular Radio Signal Waves -->
  <!-- Center Core Dot -->
  <circle cx="32" cy="30" r="3.5" fill="#00f0ff"/>

  <!-- Wave 1 -->
  <path d="M26 24 A 8.5 8.5 0 0 1 38 24" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  <path d="M26 36 A 8.5 8.5 0 0 0 38 36" fill="none" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>

  <!-- Wave 2 -->
  <path d="M22 19 A 14.5 14.5 0 0 1 42 19" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M22 41 A 14.5 14.5 0 0 0 42 41" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- Radar Crosshairs -->
  <line x1="32" y1="18" x2="32" y2="42" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 2"/>
  <line x1="20" y1="30" x2="44" y2="30" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="2 2"/>

  <!-- Security Check Accent -->
  <circle cx="46" cy="46" r="6" fill="#0a0f1d" stroke="#00f0ff" stroke-width="1.5"/>
  <path d="M43 46 L45.5 48.5 L49.5 43.5" fill="none" stroke="#00f0ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
